[project]
name = "neon-ducklake"
version = "0.1.0"
description = "NEON Data API metadata lakehouse and full-AVU site subtrees as a MESA DuckLake project."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Tyson L. Swetnam" }]
dependencies = [
    "duckdb==2.0.0",
    "pyarrow>=17",
    "numpy>=1.26",
    "h5py>=3.10",
    "python-irodsclient==3.3.0",
    "neon-mcp",
    "mesa-mcp[ducklake]",
    "mesa-ducklake",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
neon-ducklake = "neon_ducklake.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neon_ducklake"]

[tool.uv.sources]
# None of the three is on PyPI. Each is pinned to the commit the MCP servers of the MESA install run
# (the same trees `neon-ducklake preflight` reports; it warns when an installed commit differs from these revs).
#
# Developing against local checkouts instead:
#   * one-off:   uv sync --extra dev && uv pip install -e ../neon-mcp -e ../mesa-mcp -e ../mesa-ducklake
#                then run with `uv run --no-sync ...` (or .venv/bin/...): a plain `uv sync`/`uv run`
#                reinstalls the pinned revs.
#   * sticky:    replace a line below with e.g. `neon-mcp = { path = "../neon-mcp", editable = true }` and run
#                `uv lock && uv sync --extra dev`; do not commit that swap (it rewrites uv.lock with local paths).
neon-mcp = { git = "https://github.com/idss-mesa/neon-mcp", rev = "a5949d2525e0909decb1c0dda41112b76570bc82" }
mesa-mcp = { git = "https://github.com/idss-mesa/mesa-mcp", rev = "0e2e561b023abb896d148a8b85d3ba6b4f386d2e" }
mesa-ducklake = { git = "https://github.com/idss-mesa/mesa-ducklake", rev = "00a2ee84b71179ce748d3263c0fcb9b2b9418dbc" }

[tool.uv]
# Keep shared libraries identical to $MESA_HOME/.venv (default ~/.mesa/.venv, the MCP servers' runtime).
constraint-dependencies = [
    "mcp==2.2.0",
    "mcp-types==2.2.0",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "structlog==26.1.0",
    "httpx==0.28.1",
    "anyio==4.15.1",
    "starlette==1.7.0",
    "psycopg==3.3.6",
    "platformdirs==4.11.12",
    "pyyaml==6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
