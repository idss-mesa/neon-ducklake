[project]
name = "neon-ducklake"
version = "0.1.0"
description = "NEON Data API metadata lakehouse and full-AVU site subtrees as a MESA DuckLake project."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Tyson L. Swetnam" }]
dependencies = [
    "duckdb==1.5.5",
    "pyarrow>=17",
    "numpy>=1.26",
    "h5py>=3.10",
    "python-irodsclient==3.3.0",
    "neon-mcp",
    "mesa-mcp[ducklake]",
    "mesa-ducklake",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
neon-ducklake = "neon_ducklake.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neon_ducklake"]

[tool.uv.sources]
# The *installed* trees that the running MCP servers import (not the older github copies).
neon-mcp = { path = "/home/tswetnam/github/idss-mesa/neon-mcp", editable = true }
mesa-mcp = { path = "/home/tswetnam/.mesa/repos/mesa-mcp", editable = true }
mesa-ducklake = { path = "/home/tswetnam/.mesa/repos/mesa-ducklake", editable = true }

[tool.uv]
# Keep shared libraries identical to ~/.mesa/.venv (the MCP servers' runtime).
constraint-dependencies = [
    "mcp==2.2.0",
    "mcp-types==2.2.0",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "structlog==26.1.0",
    "httpx==0.28.1",
    "anyio==4.15.1",
    "starlette==1.7.0",
    "psycopg==3.3.6",
    "platformdirs==4.11.12",
    "pyyaml==6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
